name: Windows-Installer

# The version is <major.minor from the file VERSION>.<build number>, e.g. 1.0.15; the release tag is v1.0.15.
# Branch main: stable releases ("latest"). Branch next: pre-releases (1.1.20-beta), offered only to users on the beta channel.
# Builds BlockCore for Windows (installer and portable zip) on every push to main
# (or by hand: Actions -> Windows-Installer -> Run workflow) and publishes both as a GitHub release.
# See Resources/windowsStandalone/build-windows.sh

on:
  push:
    branches: [ main, next ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-standalone:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Cache local maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache downloaded Windows tools
        uses: actions/cache@v4
        with:
          path: target/windowsStandalone/downloads
          key: windows-downloads-${{ hashFiles('Resources/windowsStandalone/build-windows.sh') }}
      - name: Install cross compiler and installer builder
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 nsis zip unzip
      - name: Build with maven
        run: mvn --batch-mode clean install -DskipTests
      - name: Version (major.minor from the file VERSION, the build number as patch; -beta on the branch next)
        run: |
          if [ "${{ github.ref_name }}" = "next" ]; then suffix="-beta"; prerelease=true; else suffix=""; prerelease=false; fi
          echo "BLOCKCORE_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}$suffix" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
      - name: Build the Windows standalone lab
        run: Resources/windowsStandalone/build-windows.sh target/windowsStandalone
      - name: Publish the release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BLOCKCORE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: BlockCore ${{ env.BLOCKCORE_VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          body: |
            **BlockCore ${{ env.BLOCKCORE_VERSION }}** for Windows${{ env.PRERELEASE == 'true' && ' – pre-release for testing (beta channel)' || '' }}

            Download **BlockCore-Setup.exe** and install it (no admin rights needed).
            Or unzip **BlockCore-portable.zip** and start `BlockCore.exe`.

            Guide and help: see the [README](https://github.com/${{ github.repository }}#readme).

            Commit: ${{ github.sha }}
          files: |
            target/windowsStandalone/BlockCore-Setup.exe
            target/windowsStandalone/BlockCore-portable.zip
      - name: Wait before the second attempt (GitHub answers 500 now and then)
        if: steps.publish.outcome == 'failure'
        run: sleep 60
      - name: Publish the release (second attempt)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BLOCKCORE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: BlockCore ${{ env.BLOCKCORE_VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          body: |
            **BlockCore ${{ env.BLOCKCORE_VERSION }}** for Windows${{ env.PRERELEASE == 'true' && ' – pre-release for testing (beta channel)' || '' }}

            Download **BlockCore-Setup.exe** and install it (no admin rights needed).
            Or unzip **BlockCore-portable.zip** and start `BlockCore.exe`.

            Guide and help: see the [README](https://github.com/${{ github.repository }}#readme).

            Commit: ${{ github.sha }}
          files: |
            target/windowsStandalone/BlockCore-Setup.exe
            target/windowsStandalone/BlockCore-portable.zip
