name: Windows-Installer

# Builds the standalone Open Roberta Lab for Windows (installer and portable zip) on every push to main
# (or by hand: Actions -> Windows-Installer -> Run workflow) and publishes both as a GitHub release.
# See Resources/windowsStandalone/build-windows.sh

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-standalone:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Cache local maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache downloaded Windows tools
        uses: actions/cache@v4
        with:
          path: target/windowsStandalone/downloads
          key: windows-downloads-${{ hashFiles('Resources/windowsStandalone/build-windows.sh') }}
      - name: Install cross compiler and installer builder
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 nsis zip unzip
      - name: Build with maven
        run: mvn --batch-mode clean install -DskipTests
      - name: Build the Windows standalone lab
        run: Resources/windowsStandalone/build-windows.sh target/windowsStandalone
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Open Roberta Lab für Windows (Build ${{ github.run_number }})
          make_latest: true
          body: |
            **OpenRobertaLab-Setup.exe** herunterladen und installieren (keine Admin-Rechte nötig).
            Alternativ **OpenRobertaLab-portable.zip** entpacken und `OpenRobertaLab.exe` starten.

            Anleitung und Hilfe: siehe [README](https://github.com/${{ github.repository }}#readme).

            Commit: ${{ github.sha }}
          files: |
            target/windowsStandalone/OpenRobertaLab-Setup.exe
            target/windowsStandalone/OpenRobertaLab-portable.zip
